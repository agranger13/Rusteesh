[package]
edition      = "2024"
name         = "rusteesh"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "rusteesh"
path = "./src/bin/main.rs"
# The binary only makes sense for the board: it is not built by
# `cargo test-host`, which turns the `hw` feature off.
required-features = ["hw"]

[features]
default = ["hw"]
# Everything that touches the esp32c6 hardware. Off for PC tests.
hw = [
  "dep:esp-hal",
  "dep:esp-backtrace",
  "dep:esp-bootloader-esp-idf",
  "dep:esp-println",
  "dep:critical-section",
  "dep:esp-rtos",
  # Only used from `board` / `main`, which are hardware-only.
  "dep:static_cell",
  "dep:embassy-executor",
  "dep:embassy-time",
  "dep:embassy-sync",
]

[dependencies]
# --- Hardware: optional, only builds for the riscv32 target ---
esp-hal = { version = "~1.1.2", features = ["esp32c6", "unstable"], optional = true }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"], optional = true }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"], optional = true }
esp-println = { version = "0.17.0", features = ["esp32c6"], optional = true }
critical-section = { version = "1.2.0", optional = true }

# --- Portable: builds on the PC as well as on the board ---
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-graphics = "0.8"
mipidsi = "0.10.0"
heapless = "0.9"

lora-phy = "3.0.1"

# --- Runtime: hardware-only, see the `hw` feature ---
static_cell = { version = "2.1", optional = true }
embassy-executor = { version = "0.10.0", optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "embassy"], optional = true }
embassy-embedded-hal = "0.6.0"

[dev-dependencies]
embedded-graphics-simulator = "0.8"
# Not used directly: this pulls SDL2 in for embedded-graphics-simulator.
# `bundled` builds SDL2 from source (needs cmake) and `static-link` folds it
# into the binary, so there is no SDL2.lib to install nor SDL2.dll to ship.
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
